[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clawcross-groups"
version = "0.1.0"
description = "A small independent group website and relay, without Agent or LLM runtimes"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=14,<17", "itsdangerous>=2.2,<3", "qrcode>=8,<9"]

[project.scripts]
clawcross-groups = "clawcross_groups.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clawcross_groups = ["web/public/*", "web/admin/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
